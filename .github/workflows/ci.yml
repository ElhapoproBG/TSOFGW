name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas
        run: cargo test --all
      - name: Prueba de carga (humo)
        run: cargo run --release -p tsofgw-cli -- loadtest --clients 30 --npcs 2000 --seconds 6
      - name: Prueba de carga con hilos, LOD y presupuesto (humo)
        run: cargo run --release -p tsofgw-cli -- loadtest --clients 40 --npcs 2000 --seconds 6 --threads 2 --lod --budget 1200
      - name: Clúster de shards simulado (humo; falla si algo se pierde o se duplica)
        run: cargo run --release -p tsofgw-cli -- loadtest --shards 2x1 --clients 20 --npcs 2000 --seconds 10 --patrol 10
      - name: Clúster de shards sobre UDP real (humo)
        if: runner.os == 'Linux'
        run: cargo run --release -p tsofgw-cli -- loadtest --shards 2x1 --clients 20 --npcs 2000 --seconds 12 --patrol 10 --udp

  sin-c:
    name: pruebas con respaldo en Rust (sin compilador de C)
    runs-on: ubuntu-latest
    env:
      TSOFGW_NO_C: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all

  gpu:
    name: backend wgpu (Vulkan por software con lavapipe)
    runs-on: ubuntu-latest
    env:
      TSOFGW_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Controlador Vulkan por software
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - name: Compilar
        run: cargo build --release --manifest-path gpu/tsofgw-wgpu/Cargo.toml --all-targets
      - name: Pruebas (GPU contra software)
        run: cargo test --release --manifest-path gpu/tsofgw-wgpu/Cargo.toml -- --nocapture
